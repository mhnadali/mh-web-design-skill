name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate engine data
        run: python engine/scripts/validate_data.py
      - name: Engine tests
        run: cd engine/scripts/tests && python -m unittest discover -s .
      - name: Check markdown links
        run: python .github/scripts/check_links.py
      - name: Check SKILL.md front matter
        run: |
          head -1 SKILL.md | grep -q '^---$'
          grep -q '^name: mh-web-design-skill$' SKILL.md
          grep -q '^description:' SKILL.md
